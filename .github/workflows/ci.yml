name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # 後端
      - run: npm run check

      - run: npm test

      # 新前端（web/）
      - run: npm run typecheck

      - run: npm run test:web

      - run: npm run build

      # OS 模式延遲載入檢查（docs/os-mode-spec.md A5、P4）：網頁模式的進入點不含 three／OS 程式碼，大小不超標
      - run: npm run verify:os-bundle
